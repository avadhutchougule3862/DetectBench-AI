
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | DetectBench AI</title>
</head>
<body>
    <h1>Create DetectBench AI Account</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p>{{ message }}</p>
      {% endfor %}
    {% endwith %}

    <form method="POST">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required minlength="3" maxlength="80">

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required maxlength="120">

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required minlength="8">

        <button type="submit">Register</button>
    </form>

    <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</body>
</html>
